name: Expo Native Android Foundation

on:
  push:
    branches:
      - migration/expo-native-android
    paths:
      - "native/**"
      - ".github/workflows/expo-native-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expo-native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install and validate Expo foundation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspect Expo agent CLI commands
        run: npx --yes @expo/agent-cli@latest --help

      - name: Detect Expo SDK and project state
        run: npx --yes @expo/agent-cli@latest status

      - name: Install project dependencies
        run: npx --yes @expo/agent-cli@latest install

      - name: Align dependencies with the installed Expo SDK
        run: npx expo install --fix

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Expo Doctor
        run: npx --yes expo-doctor

      - name: Prepare Android native project
        run: npx --yes @expo/agent-cli@latest prebuild --platform android --no-install

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Android debug APK
        working-directory: native/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: naufal-farma-native-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Save resolved package manifest and lockfile
        uses: actions/upload-artifact@v4
        with:
          name: expo-native-dependency-resolution
          path: |
            native/package.json
            native/package-lock.json
          if-no-files-found: warn
          retention-days: 14
